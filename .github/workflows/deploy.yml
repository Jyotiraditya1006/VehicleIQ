name: VehicleIQ CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Phase 1 Data Pipeline Unit Tests
        run: python test_pipeline.py

      - name: Run Phase 2 ML Model & Explainability Tests
        run: python test_phase2.py

      - name: Run Phase 3 FastAPI & Auth Tests
        run: python test_phase3.py

      - name: Run Phase 4 System Integration Tests
        run: python test_phase4.py

  deploy:
    needs: test-and-verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Confirmation
        run: echo "Automated test suite passed 100%! Ready for Render & Vercel deployment."
