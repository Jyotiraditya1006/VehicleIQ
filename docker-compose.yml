version: '3.8'

services:
  # 1. Production PostgreSQL Database
  postgres_db:
    image: postgres:15-alpine
    container_name: vehicleiq_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vehicleiq_secret
      POSTGRES_DB: vehicleiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicleiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Ingestion & ML Prediction Service
  backend_api:
    build: .
    container_name: vehicleiq_api
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    environment:
      - ENVIRONMENT=production
      - DB_TYPE=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=vehicleiq_secret
      - POSTGRES_HOST=postgres_db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=vehicleiq
      - JWT_SECRET_KEY=vehicleiq_super_secret_jwt_key_2026
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      - vehicleiq_data:/app/data

  # 3. Next.js Web Dashboard Frontend
  frontend_dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vehicleiq_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend_api

volumes:
  vehicleiq_data:
  postgres_data:
